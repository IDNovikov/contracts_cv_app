syntax = "proto3";

package chat.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

service ChatService {
  rpc CreateChat(CreateChatRequest) returns (ChatDetails);
  rpc GetChat(GetChatRequest) returns (ChatDetails);
  rpc UpdateChat(UpdateChatRequest) returns (ChatDetails);
  rpc DeleteChat(DeleteChatRequest) returns (google.protobuf.Empty);

  rpc GetListChats(ListChatsRequest) returns (ListChatsResponse);
  rpc GetChatMembers(GetChatMembersRequest) returns (GetChatMembersResponse);

  rpc AddMembers(AddMembersRequest) returns (google.protobuf.Empty);
  rpc RemoveMember(RemoveMemberRequest) returns (google.protobuf.Empty);
  rpc LeaveChat(LeaveChatRequest) returns (google.protobuf.Empty);

  rpc ArchiveChat(ArchiveChatRequest) returns (google.protobuf.Empty);
  rpc UnarchiveChat(UnarchiveChatRequest) returns (google.protobuf.Empty);
  rpc MuteChat(MuteChatRequest) returns (google.protobuf.Empty);
  rpc UnmuteChat(UnmuteChatRequest) returns (google.protobuf.Empty);

  rpc SendMessage(SendMessageRequest) returns (Message);
  rpc UpdateMessage(UpdateMessageRequest) returns (Message);
  rpc DeleteMessage(DeleteMessageRequest) returns (google.protobuf.Empty);

  rpc GetListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  rpc MarkAsRead(MarkAsReadRequest) returns (google.protobuf.Empty);
}

enum ChatType {
  UNSPECIFIED = 0;
  DIRECT = 1;
  GROUP = 2;
}

enum ChatMemberRole {
  OWNER = 0;
  ADMIN = 1;
  MEMBER = 2;
}

enum MessageKind {
  UNSPECIFIED = 0;
  TEXT = 1;
  SYSTEM = 2;
}

message Chat {
  string id = 1;
  ChatType type = 2;
  optional string title = 3;
  optional string avatar_url = 4;
  string created_by_id = 5;
  optional string last_message_id = 6;
  optional google.protobuf.Timestamp last_message_at = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message ChatParticipant {
  string user_id = 1;
  ChatMemberRole role = 2;
  google.protobuf.Timestamp joined_at = 3;
}

message ChatUserState {
  ChatMemberRole role = 1;
  google.protobuf.Timestamp joined_at = 2;
  optional google.protobuf.Timestamp muted_until = 3;
  optional google.protobuf.Timestamp archived_at = 4;
  optional string last_read_message_id = 5;
  optional google.protobuf.Timestamp last_read_at = 6;
}

message ChatDetails {
  Chat chat = 1;
  ChatUserState my_state = 2;
  repeated ChatParticipant participants = 3;
  optional Message last_message = 4;
  int32 unread_count = 5;
}

message ChatListItem {
  Chat chat = 1;
  ChatUserState my_state = 2;
  optional Message last_message = 3;
  int32 unread_count = 4;
}

message Message {
  string id = 1;
  string chat_id = 2;
  string author_id = 3;
  MessageKind kind = 4;
  string text = 5;
  bool is_edited = 6;
  optional google.protobuf.Timestamp edited_at = 7;
  optional string reply_to_id = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message CreateChatRequest {
  string request_id = 1;
  string actor_user_id = 2;
  ChatType type = 3;
  repeated string participant_user_ids = 4;
  optional string title = 5;
  optional string avatar_url = 6;
}

message GetChatRequest {
  string chat_id = 1;
  string actor_user_id = 2;
}

message UpdateChatRequest {
  string chat_id = 1;
  string actor_user_id = 2;
  optional string title = 3;
  optional string avatar_url = 4;
}

message DeleteChatRequest {
  string chat_id = 1;
  string actor_user_id = 2;
}

message ListChatsRequest {
  string actor_user_id = 1;
  int32 limit = 2;
  optional string cursor = 3;
  bool include_archived = 4;
}

message ListChatsResponse {
  repeated ChatListItem chats = 1;
  optional string next_cursor = 2;
}

message GetChatMembersRequest {
  string chat_id = 1;
  string actor_user_id = 2;
  int32 limit = 3;
  optional string cursor = 4;
}

message GetChatMembersResponse {
  repeated ChatParticipant participants = 1;
  optional string next_cursor = 2;
}

message AddMembersRequest {
  string chat_id = 1;
  string actor_user_id = 2;
  repeated string user_ids = 3;
}

message RemoveMemberRequest {
  string chat_id = 1;
  string actor_user_id = 2;
  string user_id = 3;
}

message LeaveChatRequest {
  string chat_id = 1;
  string actor_user_id = 2;
}

message ArchiveChatRequest {
  string chat_id = 1;
  string actor_user_id = 2;
}

message UnarchiveChatRequest {
  string chat_id = 1;
  string actor_user_id = 2;
}

message MuteChatRequest {
  string chat_id = 1;
  string actor_user_id = 2;
  google.protobuf.Timestamp muted_until = 3;
}

message UnmuteChatRequest {
  string chat_id = 1;
  string actor_user_id = 2;
}

message SendMessageRequest {
  string request_id = 1;
  string chat_id = 2;
  string author_id = 3;
  MessageKind kind = 4;
  string text = 5;
  optional string reply_to_id = 6;
}

message UpdateMessageRequest {
  string message_id = 1;
  string author_id = 2;
  string text = 3;
}

message DeleteMessageRequest {
  string message_id = 1;
  string author_id = 2;
}

message ListMessagesRequest {
  string chat_id = 1;
  string actor_user_id = 2;
  int32 limit = 3;
  optional string cursor = 4;
}

message ListMessagesResponse {
  repeated Message messages = 1;
  optional string next_cursor = 2;
}

message MarkAsReadRequest {
  string chat_id = 1;
  string actor_user_id = 2;
  string last_read_message_id = 3;
}
